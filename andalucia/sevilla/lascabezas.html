<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmApp - Farmacias de Guardia</title>

 <!-- ✅ Rutas ABSOLUTAS desde la raíz (empiezan con /) -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png">
    <link rel="apple-touch-icon" href="/logo-512.png">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FarmApp">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Iconos -->
    <link rel="apple-touch-icon" href="logo-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <!-- Botón de retroceso (dos niveles atrás) -->
            <a href="../../index.html" class="back-btn" aria-label="Volver al menú principal">
                ←
            </a>

            <div class="logo-container">
                <img src="logo.png" alt="FarmApp Logo" class="app-logo">
            </div>
            <h1>Las Cabezas de San Juan</h1>
            <h2>Farmacias de Guardia • <span id="display-year">2026</span></h2>
            
        </header>

        <div class="calendar-controls">
            <button id="prev-month" class="nav-btn">
                <i class="arrow">‹</i>
            </button>
            <h3 id="current-month-title">Cargando...</h3>
            <button id="next-month" class="nav-btn">
                <i class="arrow">›</i>
            </button>
        </div>

        <div id="calendar-container">
            <!-- Calendario -->
        </div>

        <div id="pharmacy-info">
            <h3>Selecciona un día</h3>
            <p>Elige una fecha en el calendario para ver la farmacia de guardia.</p>
        </div>
    </div>
  
    <script src="lascabezas.js"></script>
</body>
</html>
