<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farmacia Guardia 2026</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial, sans-serif;background:#f0f4f8;margin:0;padding:20px}
.header{background:linear-gradient(135deg,#44c6a9,#2a9d8f);color:#fff;padding:16px;border-radius:8px}
.container{max-width:720px;margin:20px auto}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{padding:12px;background:#fff;border-radius:8px;text-align:center;cursor:pointer;border:2px solid #e6eef0}
.info{background:#fff;padding:16px;border-radius:8px;margin-top:16px}
.color{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.footer{font-size:12px;color:#666;margin-top:12px;text-align:center}
.controls{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.btn{background:#2a9d8f;color:#fff;padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
</style>
</head><body><div class="header"><h1>Farmacia de Guardia 2026</h1></div>
<div class="container">
  <div class="controls">
    <button class="btn" onclick="prevMonth()">◀ Mes</button>
    <h2 id="mesTitulo">Enero 2026</h2>
    <button class="btn" onclick="nextMonth()">Mes ▶</button>
  </div>
  <div id="calendar" class="calendar" style="margin-top:12px"></div>
  <div id="info" class="info" style="display:none"></div>
  <div class="footer">Toca el día para ver la farmacia de guardia. Datos extraídos automáticamente de la imagen; puede haber errores, dime si corriges alguno.</div>
</div>
<script>
let farmacias = {};
let guardias = {};
fetch('farmacias.json').then(r=>r.json()).then(j=>{farmacias=j;});
fetch('guardias2026.json').then(r=>r.json()).then(j=>{guardias=j; renderMonth(0);});

let month = 0;
const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function renderMonth(m){
  month = m;
  document.getElementById('mesTitulo').textContent = months[month] + ' 2026';
  const days = new Date(2026, month+1, 0).getDate();
  const cal = document.getElementById('calendar');
  cal.innerHTML='';
  for(let d=1; d<=days; d++){
    const el = document.createElement('div'); el.className='day'; el.textContent=d;
    const key = `2026-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const colorKey = guardias[key];
    if(colorKey && farmacias[colorKey]){
      el.style.borderColor = farmacias[colorKey].color;
      el.style.boxShadow = 'inset 0 0 0 3px '+farmacias[colorKey].color;
    }
    el.onclick = ()=> showInfo(key);
    cal.appendChild(el);
  }
}

function showInfo(key){
  const info = document.getElementById('info');
  const fk = guardias[key];
  if(!fk){ info.style.display='block'; info.innerHTML='<b>No hay datos para este día.</b>'; return; }
  const f = farmacias[fk];
  info.style.display='block';
  info.innerHTML = `<div><span class="color" style="background:${f.color}"></span><strong>${f.nombre}</strong></div>
  <div><b>Dirección:</b> ${f.dir}</div><div><b>Teléfono:</b> ${f.tel}</div><div style="margin-top:8px"><b>Día:</b> ${key}</div>`;
}

function prevMonth(){ renderMonth((month-1+12)%12); }
function nextMonth(){ renderMonth((month+1)%12); }

// register service worker
if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }
</script></body></html>
