<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmApp - Farmacias de Guardia</title>

    <!-- 🔑 Metaetiquetas esenciales para iOS (modo app standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FarmApp">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Iconos -->
    <link rel="apple-touch-icon" href="logo-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="logo.png" alt="FarmApp Logo" class="app-logo">
            </div>
            <h2>Farmacias de Guardia • <span id="display-year">2026</span></h2>
        </header>

        <div class="calendar-controls">
            <button id="prev-month" class="nav-btn">
                <i class="arrow">‹</i>
            </button>
            <h3 id="current-month-title">Cargando...</h3>
            <button id="next-month" class="nav-btn">
                <i class="arrow">›</i>
            </button>
        </div>

        <div id="calendar-container">
            <!-- El calendario se generará con JavaScript -->
        </div>

        <div id="pharmacy-info">
            <h3>Selecciona un día</h3>
            <p>Elige una fecha en el calendario para ver la farmacia de guardia (solo disponible para 2026).</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
